name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: protocol/sdk/go.mod
          cache-dependency-path: protocol/sdk/go.sum
      - name: Generate and build SDK
        working-directory: protocol
        run: ./scripts/build-sdk.sh
      - name: Verify generation does not modify tracked sources
        run: git diff --exit-code -- protocol

  server-unit:
    name: Server unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Run tests
        working-directory: server
        env:
          GOWORK: "off"
        run: go test -race ./...
      - name: Check coverage
        working-directory: server
        env:
          GOWORK: "off"
        run: ./scripts/test-coverage.sh

  server-postgres:
    name: Server PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sim_deck_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sim_deck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sim_deck_test?sslmode=disable
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Run integration coverage
        working-directory: server
        run: ./scripts/test-coverage.sh

  device:
    name: Device
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: device/go.mod
          cache-dependency-path: device/go.sum
      - name: Run tests
        working-directory: device
        env:
          GOWORK: "off"
        run: go test ./...
      - name: Run race detector
        working-directory: device
        env:
          GOWORK: "off"
        run: go test -race ./...
      - name: Run vet
        working-directory: device
        env:
          GOWORK: "off"
        run: go vet ./...
      - name: Check coverage
        working-directory: device
        env:
          GOWORK: "off"
        run: ./scripts/check-coverage.sh

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Wait for simulator registration
        run: |
          for attempt in {1..6}; do
            if xcrun simctl list devices available | grep -q 'iPhone 17 Pro'; then
              exit 0
            fi
            killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            sleep 10
          done
          xcrun simctl list runtimes
          xcrun simctl list devices
          exit 1
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: Generate Swift protocol sources
        working-directory: protocol
        run: buf generate
      - name: Run simulator tests
        working-directory: ios
        run: >-
          xcodebuild test
          -project SimDeck.xcodeproj
          -scheme SimDeck
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO

  containers:
    name: ${{ matrix.component }} ${{ matrix.architecture }} container
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            architecture: amd64
            runner: ubuntu-24.04
          - component: server
            architecture: arm64
            runner: ubuntu-24.04-arm
          - component: device
            architecture: amd64
            runner: ubuntu-24.04
          - component: device
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build native architecture image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/${{ matrix.architecture }}
          push: false
          tags: sim-deck-${{ matrix.component }}:ci-${{ matrix.architecture }}

