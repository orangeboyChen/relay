name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            device/go.sum
            protocol/go.sum
            server/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: Build Go modules
        run: |
          (cd device && GOWORK=off go build ./...)
          (cd server && GOWORK=off go build ./...)
          (cd protocol/sdk && GOWORK=off go build ./...)
      - uses: github/codeql-action/analyze@v4

