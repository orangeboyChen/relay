name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            device/go.sum
            protocol/sdk/go.sum
            server/go.sum
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: Generate Go protocol SDK
        working-directory: protocol
        run: buf generate
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: Build Go modules
        run: |
          go build ./device/...
          go build ./server/...
          go build ./protocol/sdk/...
      - uses: github/codeql-action/analyze@v4

