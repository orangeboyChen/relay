name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z or vx.y.z; takes precedence)"
        required: false
        type: string
      bump:
        description: "Version component to increment when version is empty"
        required: true
        default: z
        type: choice
        options: [x, y, z]

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP_INPUT: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          normalize_version() {
            local candidate="${1#v}"
            if [[ ! "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version: $1" >&2
              exit 1
            fi
            printf '%s' "$candidate"
          }
          if [[ -n "$VERSION_INPUT" ]]; then
            version="$(normalize_version "$VERSION_INPUT")"
          else
            current="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n 1)"
            current="${current:-0.0.0}"
            IFS=. read -r major minor patch <<< "$(normalize_version "$current")"
            case "$BUMP_INPUT" in
              x) major=$((10#$major + 1)); minor=0; patch=0 ;;
              y) minor=$((10#$minor + 1)); patch=0 ;;
              z) patch=$((10#$patch + 1)) ;;
              *) echo "Unsupported bump: $BUMP_INPUT" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
          fi
          if git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null; then
            echo "Version $version already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            image: sim-deck-server
            architecture: amd64
            runner: ubuntu-24.04
          - component: server
            image: sim-deck-server
            architecture: arm64
            runner: ubuntu-24.04-arm
          - component: device
            image: sim-deck-device
            architecture: amd64
            runner: ubuntu-24.04
          - component: device
            image: sim-deck-device
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push native image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.architecture }}

  manifest:
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: sim-deck-server
          - image: sim-deck-device
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-architecture image
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    needs: [prepare, manifest]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Images:
            - `ghcr.io/${{ needs.prepare.outputs.owner }}/sim-deck-server:${{ needs.prepare.outputs.version }}`
            - `ghcr.io/${{ needs.prepare.outputs.owner }}/sim-deck-device:${{ needs.prepare.outputs.version }}`

