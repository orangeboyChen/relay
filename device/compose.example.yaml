x-device-environment: &device-environment
  SIM_DECK_SERVER_URL: "${SIM_DECK_SERVER_URL:?set SIM_DECK_SERVER_URL}"
  SIM_DECK_ALLOW_INSECURE_HTTP: "${SIM_DECK_ALLOW_INSECURE_HTTP:-false}"
  SIM_DECK_AT_DEVICE: /dev/sim-deck/at
  SIM_DECK_STATE_DIRECTORY: /var/lib/sim-deck
  SIM_DECK_DISCOVERY_POLL_INTERVAL: 2s
  SIM_DECK_COMMAND_POLL_INTERVAL: 1s

x-device-defaults: &device-defaults
  image: sim-deck/device:dev
  build:
    context: .
  restart: unless-stopped
  group_add:
    - "${SIM_DECK_DIALOUT_GID:-20}"
    - "${SIM_DECK_AUDIO_GID:-29}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m

services:
  modem-1:
    <<: *device-defaults
    hostname: sim-deck-modem-1
    environment:
      <<: *device-environment
      SIM_DECK_DEVICE_UUID: "${SIM_DECK_MODEM_1_DEVICE_UUID:?set SIM_DECK_MODEM_1_DEVICE_UUID}"
      SIM_DECK_AUDIO_MODE: "${SIM_DECK_MODEM_1_AUDIO_MODE:-alsa}"
      SIM_DECK_ALSA_CAPTURE_DEVICE: "${SIM_DECK_MODEM_1_ALSA_CAPTURE_DEVICE:-hw:0,0}"
      SIM_DECK_ALSA_PLAYBACK_DEVICE: "${SIM_DECK_MODEM_1_ALSA_PLAYBACK_DEVICE:-hw:0,0}"
      SIM_DECK_PCM_ENDPOINT: "${SIM_DECK_MODEM_1_PCM_ENDPOINT:-}"
      SIM_DECK_PCM_TLS_CA_FILE: "${SIM_DECK_MODEM_1_PCM_TLS_CA_FILE:-}"
      SIM_DECK_PCM_TLS_CERT_FILE: "${SIM_DECK_MODEM_1_PCM_TLS_CERT_FILE:-}"
      SIM_DECK_PCM_TLS_KEY_FILE: "${SIM_DECK_MODEM_1_PCM_TLS_KEY_FILE:-}"
      SIM_DECK_MEDIA_UDP_PORT: "${SIM_DECK_MODEM_1_MEDIA_UDP_PORT:?set SIM_DECK_MODEM_1_MEDIA_UDP_PORT}"
      SIM_DECK_MEDIA_TCP_PORT: "${SIM_DECK_MODEM_1_MEDIA_TCP_PORT:?set SIM_DECK_MODEM_1_MEDIA_TCP_PORT}"
      SIM_DECK_MEDIA_PUBLIC_IP: "${SIM_DECK_MODEM_1_MEDIA_PUBLIC_IP:?set SIM_DECK_MODEM_1_MEDIA_PUBLIC_IP}"
    devices:
      - "${SIM_DECK_MODEM_1_AT_DEVICE:-/dev/sim-deck/modem-1-at}:/dev/sim-deck/at"
      - "${SIM_DECK_MODEM_1_AUDIO_CONTROL:-/dev/sim-deck/modem-1-audio-control}:/dev/snd/controlC0"
      - "${SIM_DECK_MODEM_1_AUDIO_CAPTURE:-/dev/sim-deck/modem-1-audio-capture}:/dev/snd/pcmC0D0c"
      - "${SIM_DECK_MODEM_1_AUDIO_PLAYBACK:-/dev/sim-deck/modem-1-audio-playback}:/dev/snd/pcmC0D0p"
    volumes:
      - modem-1-state:/var/lib/sim-deck
    ports:
      - 127.0.0.1:18081:8080
      - "${SIM_DECK_MODEM_1_MEDIA_UDP_PORT:?set SIM_DECK_MODEM_1_MEDIA_UDP_PORT}:${SIM_DECK_MODEM_1_MEDIA_UDP_PORT:?set SIM_DECK_MODEM_1_MEDIA_UDP_PORT}/udp"
      - "${SIM_DECK_MODEM_1_MEDIA_TCP_PORT:?set SIM_DECK_MODEM_1_MEDIA_TCP_PORT}:${SIM_DECK_MODEM_1_MEDIA_TCP_PORT:?set SIM_DECK_MODEM_1_MEDIA_TCP_PORT}/tcp"

  modem-2:
    <<: *device-defaults
    hostname: sim-deck-modem-2
    environment:
      <<: *device-environment
      SIM_DECK_DEVICE_UUID: "${SIM_DECK_MODEM_2_DEVICE_UUID:?set SIM_DECK_MODEM_2_DEVICE_UUID}"
      SIM_DECK_AUDIO_MODE: "${SIM_DECK_MODEM_2_AUDIO_MODE:-alsa}"
      SIM_DECK_ALSA_CAPTURE_DEVICE: "${SIM_DECK_MODEM_2_ALSA_CAPTURE_DEVICE:-hw:0,0}"
      SIM_DECK_ALSA_PLAYBACK_DEVICE: "${SIM_DECK_MODEM_2_ALSA_PLAYBACK_DEVICE:-hw:0,0}"
      SIM_DECK_PCM_ENDPOINT: "${SIM_DECK_MODEM_2_PCM_ENDPOINT:-}"
      SIM_DECK_PCM_TLS_CA_FILE: "${SIM_DECK_MODEM_2_PCM_TLS_CA_FILE:-}"
      SIM_DECK_PCM_TLS_CERT_FILE: "${SIM_DECK_MODEM_2_PCM_TLS_CERT_FILE:-}"
      SIM_DECK_PCM_TLS_KEY_FILE: "${SIM_DECK_MODEM_2_PCM_TLS_KEY_FILE:-}"
      SIM_DECK_MEDIA_UDP_PORT: "${SIM_DECK_MODEM_2_MEDIA_UDP_PORT:?set SIM_DECK_MODEM_2_MEDIA_UDP_PORT}"
      SIM_DECK_MEDIA_TCP_PORT: "${SIM_DECK_MODEM_2_MEDIA_TCP_PORT:?set SIM_DECK_MODEM_2_MEDIA_TCP_PORT}"
      SIM_DECK_MEDIA_PUBLIC_IP: "${SIM_DECK_MODEM_2_MEDIA_PUBLIC_IP:?set SIM_DECK_MODEM_2_MEDIA_PUBLIC_IP}"
    devices:
      - "${SIM_DECK_MODEM_2_AT_DEVICE:-/dev/sim-deck/modem-2-at}:/dev/sim-deck/at"
      - "${SIM_DECK_MODEM_2_AUDIO_CONTROL:-/dev/sim-deck/modem-2-audio-control}:/dev/snd/controlC0"
      - "${SIM_DECK_MODEM_2_AUDIO_CAPTURE:-/dev/sim-deck/modem-2-audio-capture}:/dev/snd/pcmC0D0c"
      - "${SIM_DECK_MODEM_2_AUDIO_PLAYBACK:-/dev/sim-deck/modem-2-audio-playback}:/dev/snd/pcmC0D0p"
    volumes:
      - modem-2-state:/var/lib/sim-deck
    ports:
      - 127.0.0.1:18082:8080
      - "${SIM_DECK_MODEM_2_MEDIA_UDP_PORT:?set SIM_DECK_MODEM_2_MEDIA_UDP_PORT}:${SIM_DECK_MODEM_2_MEDIA_UDP_PORT:?set SIM_DECK_MODEM_2_MEDIA_UDP_PORT}/udp"
      - "${SIM_DECK_MODEM_2_MEDIA_TCP_PORT:?set SIM_DECK_MODEM_2_MEDIA_TCP_PORT}:${SIM_DECK_MODEM_2_MEDIA_TCP_PORT:?set SIM_DECK_MODEM_2_MEDIA_TCP_PORT}/tcp"

volumes:
  modem-1-state:
  modem-2-state:
