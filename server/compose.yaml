services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: simdeck
      POSTGRES_USER: simdeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simdeck -d simdeck"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build:
      context: .
    image: sim-deck/server:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://simdeck:${POSTGRES_PASSWORD}@postgres:5432/simdeck?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      HTTP_ADDR: :8080
      MEDIA_UDP_PORT: ${MEDIA_UDP_PORT:-49152}
      MEDIA_TCP_PORT: ${MEDIA_TCP_PORT:-49153}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      RECOVERY_PUBLIC_KEY_FILE: /run/secrets/recovery_public_key
      APNS_KEY_ID: ${APNS_KEY_ID:?Set APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID:?Set APNS_TEAM_ID}
      APNS_TOPIC: ${APNS_TOPIC:-com.nowcent.simdeck.voip}
      APNS_PRIVATE_KEY_FILE: /run/secrets/apns_private_key
      ATTACHMENT_ROOT: /var/lib/sim-deck/attachments
    secrets:
      - admin_password
      - recovery_public_key
      - apns_private_key
    ports:
      - "${HTTPS_PORT:-8443}:8080"
      - "${MEDIA_UDP_PORT:-49152}:${MEDIA_UDP_PORT:-49152}/udp"
      - "${MEDIA_TCP_PORT:-49153}:${MEDIA_TCP_PORT:-49153}/tcp"
    volumes:
      - attachment-data:/var/lib/sim-deck/attachments

secrets:
  admin_password:
    file: ${ADMIN_PASSWORD_FILE:-./secrets/admin_password.txt}
  recovery_public_key:
    file: ${RECOVERY_PUBLIC_KEY_FILE:-./secrets/recovery_public_key.txt}
  apns_private_key:
    file: ${APNS_PRIVATE_KEY_FILE:?Set APNS_PRIVATE_KEY_FILE}

volumes:
  postgres-data:
  attachment-data:
